name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # In-memory MongoDB, no secrets needed. Fails below 100% coverage.
      - name: Tests with coverage
        run: npm test
      - name: Coverage summary
        if: always()
        run: |
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./coverage/coverage-summary.json').total;for(const k of ['statements','branches','functions','lines'])console.log('- '+k+': '+t[k].pct+'%')" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
